<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="descripton" content="Build a profile page using correctly described images, figures, native audio, and native video.">
    <title>personal profile</title>
</head>
<body>
    <section>
        <!--  A profile image with meaningful alternative text. -->
        <img src="" alt="My profile image">
        
        <!-- A genuinely decorative image with an empty alt attribute. -->
        <img src="decorative-wave.svg"
            alt=""
            width="1200"
            height="180">

        <!-- A <figure> with a related <figcaption>. -->
        <figure>
        <img src="work-setup.svg"
            alt="Illustration of a laptop displaying a simple code editor."
            width="900"
            height="520">

        <figcaption>
            A simple workspace for experimenting, learning, and creating.
        </figcaption>
    </figure>
    </section>
</body>
</html>
