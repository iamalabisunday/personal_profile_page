<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="descripton" content="Build a profile page using correctly described images, figures, native audio, and native video.">
    <title>personal profile</title>
</head>
<body>
        <!--  A profile image with meaningful alternative text. -->
    <section>
        <h2>My name is Sunday Alabi</h2>
        <img src="./assets/profitImage.jpg" alt="My profile image" width="200">
    </section>
        <!-- A genuinely decorative image with an empty alt attribute. -->
    <section>
        <img src="./assets/laptop.jpg" alt="" width="200">
    </section>
        <!-- A <figure> with a related <figcaption>. -->
    <section>
        <figure>
            <img src="./assets/team.jpg" alt="A team of developers brainstorming." width="300">
            <figcaption>
                Strength comes from working together.
            </figcaption>
        </figure>
    </section>
        <!-- One <audio> element with controls and at least one <source>. -->
    <section>
        <audio controls>
            <source src="./assets/Dredstudio.wav" type="audio/wav">
             <p>If your browser can't play this audio, kindly access it at <a href="https://dredstudio.com/">https://dredstudio.com/</a> instead.</p>
        </audio>
    </section>
    <br>
        <!-- One <video> element with controls and at least one <source> -->
    <section>
        <video controls>
            <source src="./assets/John Denver.mp4">
            <p>If your browser can't play this video, kindly access it at <a href="https://youtu.be/uu7j_xljCRY?si=6QjJDkPzDQLrh264">John Denver - Take Me Home, Country Roads (Lyrics) </a>instead.</p>
        </video>
    </section>
</body>
</html>
